[project]
name = "waters2mzml"
version = "0.1.0"
description = "Modernized Waters .raw → .mzML conversion and annotation pipeline"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.9.0",
  "numpy>=1.26",
  "pyteomics",
  "lxml",
  "psims",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[project.scripts]
waters2mzml = "waters2mzml.cli:app"

[tool.pytest.ini_options]
addopts = "--cov=waters2mzml --cov-report=term-missing"
