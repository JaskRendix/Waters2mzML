[project]
name = "waters2mzml"
version = "0.1.0"
description = "Modernized Waters .raw → .mzML conversion and annotation pipeline"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.9.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest"
]

[project.scripts]
waters2mzml = "waters2mzml.cli:app"
